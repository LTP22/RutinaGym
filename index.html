<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mi rutina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Mi rutina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: app shell. Sticky brand bar, one view at a time (Entrenar / Calendario / Progreso / Ajustes),
   floating rest timer above a bottom tab bar. Bold move: wide scoreboard numerals for weights, rings and the timer. */
:root {
  --bg: #f2f3f5;
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --ink: #101114;
  --muted: #6b707c;
  --line: #e3e5ea;
  --accent: #ff5a1f;
  --accent-ink: #ffffff;
  --accent-soft: #ffe9df;
  --good: #12a150;
  --good-soft: #def5e7;
  --gold: #d99a00;
  --gold-soft: #fff1cc;
  --danger: #d6342c;
  --shadow: 0 1px 2px rgba(16,17,20,.05), 0 8px 24px rgba(16,17,20,.06);
  --font-display: "Archivo", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --nav-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0c0f; --surface: #15171c; --surface-2: #1c1f26; --ink: #f2f3f5; --muted: #8f95a3; --line: #262a33;
    --accent: #ff6a33; --accent-ink: #120a06; --accent-soft: #3a1c10; --good: #35c97c; --good-soft: #12301f;
    --gold: #f4c247; --gold-soft: #3a2e0e; --danger: #ff6b63; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0c0f; --surface: #15171c; --surface-2: #1c1f26; --ink: #f2f3f5; --muted: #8f95a3; --line: #262a33;
  --accent: #ff6a33; --accent-ink: #120a06; --accent-soft: #3a1c10; --good: #35c97c; --good-soft: #12301f;
  --gold: #f4c247; --gold-soft: #3a2e0e; --danger: #ff6b63; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wide { font-family: var(--font-display); font-stretch: 125%; font-weight: 800; letter-spacing: -.01em; }
.cond { font-family: var(--font-display); font-stretch: 75%; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }

/* Top bar */
.app-top { position: sticky; top: 0; z-index: 6; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); padding: calc(env(safe-area-inset-top) + 10px) 18px 10px; }
.brand { max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
.brand-name { display: flex; align-items: center; gap: 8px; font-size: .95rem; }
.brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { width: 16px; height: 16px; }
.status { display: flex; align-items: center; gap: 6px; font-size: .75rem; color: var(--muted); font-weight: 600; }
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.status[data-s="ok"]::before { background: var(--good); }
.status[data-s="saving"]::before { background: var(--accent); }
.status[data-s="warn"]::before { background: var(--danger); }

main { max-width: 640px; margin: 0 auto; padding: 4px 16px calc(env(safe-area-inset-bottom) + var(--nav-h) + 110px); display: grid; gap: 16px; }
.view-title { font-size: 1.9rem; margin: 6px 0 0; line-height: 1.05; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; font-size: .92rem; }

/* Day strip */
.days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day { border: 0; background: var(--surface); border-radius: 14px; padding: 8px 0 7px; display: grid; justify-items: center; gap: 3px; box-shadow: var(--shadow); position: relative; }
.day .d { font-size: .78rem; }
.day .c { font-size: .66rem; color: var(--muted); font-weight: 600; }
.day.free .d { color: var(--muted); }
.day[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.day[aria-selected="true"] .c { color: var(--bg); opacity: .7; }
.day.did .c { color: var(--good); }
.day.part .c { color: var(--accent); }
.day.skip .d { color: var(--muted); text-decoration: line-through; }
.day.skip[aria-selected="true"] .d { color: var(--bg); }
.pend-act { display: flex; align-items: center; gap: 12px; flex: none; }
.day.part[aria-selected="true"] .c { color: var(--bg); }
.day.did[aria-selected="true"] .c { color: var(--bg); }
.pending { gap: 10px; border: 1.5px solid var(--accent-soft); }
.pend-row { border: 0; background: var(--surface-2); border-radius: 14px; padding: 11px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; }
.pend-row b { display: block; font-weight: 800; }
.pend-row small { color: var(--muted); font-size: .78rem; }
.day-card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 14px; display: grid; gap: 8px; border: 1.5px solid var(--line); }
.day-card.on { border-color: var(--accent); }
.day-card b { font-size: 1.05rem; }
.day-card .btns .btn { flex: 1; padding: 11px 12px; }
.move-note { background: var(--accent-soft); border-radius: 14px; padding: 10px 12px; font-size: .85rem; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.move-note .link { flex: none; }
.day.is-today::after { content: ""; position: absolute; top: 5px; right: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }

/* Hero */
.hero { background: var(--surface); border-radius: 22px; padding: 18px; box-shadow: var(--shadow); display: grid; gap: 16px; overflow: hidden; position: relative; }
.hero::before { content: ""; position: absolute; inset: -40% -30% auto auto; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(closest-side, var(--accent-soft), transparent); pointer-events: none; }
.eyebrow { font-size: .72rem; color: var(--accent); }
.hero h1 { font-size: 1.65rem; line-height: 1.05; margin: 4px 0 0; text-wrap: balance; position: relative; }
.hero-row { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; position: relative; }
.ring { width: 104px; height: 104px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--line); }
.ring .fill { stroke: var(--accent); transition: stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1); }
.ring.full .fill { stroke: var(--good); }
.ring-c { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; text-align: center; }
.ring-c b { font-size: 1.55rem; line-height: 1; }
.ring-c span { font-size: .62rem; color: var(--muted); margin-top: 3px; }
.kpis { display: grid; gap: 10px; }
.kpi { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.kpi:last-child { border-bottom: 0; padding-bottom: 0; }
.kpi span { font-size: .8rem; color: var(--muted); font-weight: 600; }
.kpi b { font-size: 1.05rem; }
.kpi b.gold { color: var(--gold); }
.done-banner { background: var(--good-soft); color: var(--good); border-radius: 14px; padding: 12px 14px; font-weight: 700; display: flex; align-items: center; gap: 10px; position: relative; }

/* Exercise cards */
.list { display: grid; gap: 10px; }
.card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; border: 1.5px solid transparent; transition: border-color .2s; }
.card.open { border-color: var(--accent); }
.card.done:not(.open) { opacity: .78; }
.card-head { width: 100%; border: 0; background: none; padding: 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; text-align: left; }
.mini { width: 40px; height: 40px; position: relative; flex: none; }
.mini svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.mini .track { stroke: var(--line); }
.mini .fill { stroke: var(--accent); }
.mini-c { position: absolute; inset: 0; display: grid; place-items: center; font-size: .78rem; }
.card.done .mini .fill { stroke: var(--good); }
.card.done .mini-c { color: var(--good); }
.mini-c svg { width: 18px; height: 18px; transform: none; }
.head-txt { min-width: 0; display: grid; gap: 3px; }
.ex-name { font-weight: 700; font-size: 1rem; line-height: 1.25; overflow-wrap: anywhere; }
.ex-meta { font-size: .8rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.ex-meta .tgt { color: var(--accent); font-weight: 700; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: .68rem; font-weight: 800; padding: 2px 7px; border-radius: 99px; background: var(--gold-soft); color: var(--gold); letter-spacing: .02em; }
.tag.swap { background: var(--accent-soft); color: var(--accent); }
.chev { width: 22px; height: 22px; color: var(--muted); transition: transform .2s; }
.card.open .chev { transform: rotate(180deg); }
.group-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 2px; vertical-align: 1px; }

.card-body { padding: 0 14px 14px; display: grid; gap: 12px; }
.note { font-size: .84rem; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 9px 11px; line-height: 1.4; }
.swap-bar { background: var(--accent-soft); border-radius: 12px; padding: 9px 11px; font-size: .85rem; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.swap-bar b { font-weight: 700; }
.prev { font-size: .8rem; color: var(--muted); }
.prev b { color: var(--ink); font-weight: 700; }

.sets { display: grid; gap: 8px; }
.set-h, .set { display: grid; grid-template-columns: 34px 1fr 1fr 52px; gap: 8px; align-items: center; }
.set-h span { font-size: .64rem; color: var(--muted); text-align: center; }
.set .n { display: grid; place-items: center; height: 46px; border-radius: 12px; background: var(--surface-2); font-size: .95rem; color: var(--muted); }
.set .n.pr { background: var(--gold-soft); color: var(--gold); font-size: .62rem; }
.set input { width: 100%; height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); text-align: center; font-family: var(--font-display); font-stretch: 112%; font-weight: 800; font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.set input:focus { border-color: var(--accent); background: var(--surface); outline: none; }
.set input::placeholder { color: var(--muted); font-weight: 600; font-size: .9rem; }
.ok { height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; padding: 0; transition: transform .12s, background .15s; }
.ok svg { width: 22px; height: 22px; stroke: var(--muted); }
.ok:active { transform: scale(.94); }
.set.done .ok { background: var(--good); border-color: var(--good); }
.set.done .ok svg { stroke: #fff; }
.set.done input { border-color: color-mix(in srgb, var(--good) 45%, var(--line)); background: var(--good-soft); }
.card-actions { display: flex; gap: 8px; }
.ghost { flex: 1; border: 1.5px solid var(--line); background: transparent; border-radius: 12px; padding: 10px; font-weight: 700; font-size: .86rem; }
.ghost.icon { flex: none; width: 46px; display: grid; place-items: center; padding: 0; }

.add { border: 1.5px dashed var(--line); background: transparent; border-radius: 18px; padding: 16px; font-weight: 700; color: var(--accent); }
.sect-h { font-size: .72rem; color: var(--muted); margin: 8px 2px -2px; }
.off-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; border: 1.5px dashed var(--line); border-radius: 14px; padding: 11px 12px; color: var(--muted); font-size: .9rem; }
.off-row small { display: block; font-size: .75rem; }
.chip-btn { border: 1.5px solid var(--accent); color: var(--accent); background: transparent; border-radius: 99px; padding: 7px 12px; font-weight: 700; font-size: .82rem; flex: none; }

/* Panels (calendar, progress, settings) */
.panel { background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); padding: 16px; display: grid; gap: 12px; }
.panel h2 { margin: 0; font-size: 1.05rem; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 14px; padding: 10px 11px; display: grid; gap: 2px; }
.stat span { font-size: .7rem; color: var(--muted); font-weight: 600; }
.stat b { font-size: 1.25rem; line-height: 1.1; }
.stat b.up { color: var(--good); }
.round { width: 38px; height: 38px; border-radius: 12px; border: 1.5px solid var(--line); background: transparent; display: grid; place-items: center; font-size: 1.2rem; }
.round:disabled { opacity: .3; }

.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal .dow { font-size: .66rem; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cal button { aspect-ratio: 1; border: 0; background: var(--surface-2); border-radius: 12px; padding: 0; display: grid; place-items: center; font-weight: 700; font-size: .92rem; font-variant-numeric: tabular-nums; position: relative; }
.cal button.trained { background: var(--accent); color: var(--accent-ink); }
.cal button.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal button.trained.today { box-shadow: inset 0 0 0 2px var(--ink); }
.cal button[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.cal button:disabled { opacity: .3; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.log li { background: var(--surface-2); border-radius: 14px; padding: 10px 12px; display: grid; gap: 3px; font-size: .88rem; }
.log li b { font-weight: 700; }
.log li small { color: var(--muted); }
.link { background: none; border: 0; color: var(--accent); padding: 4px 0; font-weight: 700; font-size: .85rem; justify-self: start; }

.ex-list { display: grid; gap: 8px; }
.ex-row { border: 0; background: var(--surface-2); border-radius: 14px; padding: 11px 12px; display: grid; grid-template-columns: 1fr 86px auto; gap: 10px; align-items: center; text-align: left; }
.ex-row b { font-weight: 700; font-size: .92rem; display: block; overflow-wrap: anywhere; }
.ex-row small { color: var(--muted); font-size: .75rem; }
.ex-row .val { text-align: right; }
.ex-row .val b { font-size: 1.1rem; }
.ex-row .val small.up { color: var(--good); font-weight: 700; }
.spark { width: 86px; height: 32px; }
.spark path { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.search { width: 100%; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 12px; font-size: 16px; }
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); }
.chart .lbl { fill: var(--muted); font-size: 10px; font-family: var(--font-body); font-weight: 600; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .12; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .end { fill: var(--accent); }
.chart .endlbl { fill: var(--ink); font-size: 12px; font-weight: 800; font-family: var(--font-body); }
.sess-del { background: none; border: 0; color: var(--muted); font-size: .78rem; font-weight: 600; justify-self: end; padding: 2px 0; }
.sess-del.armed { color: var(--danger); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: grid; gap: 8px; justify-items: center; }
.empty b { color: var(--ink); font-size: 1.05rem; }
.empty svg { width: 44px; height: 44px; color: var(--accent); }

/* Progress extras */
.sub-h { font-size: .7rem; color: var(--muted); margin-top: 4px; }
.chart .bar { fill: var(--line); }
.chart .bar-now { fill: var(--accent); }
.chart .line.thin { stroke-width: 1.5; opacity: .55; }
.chart .line2 { fill: none; stroke: var(--good); stroke-width: 2.8; stroke-linejoin: round; stroke-linecap: round; }
.stat .dl { font-size: .66rem; font-weight: 700; color: var(--muted); }
.stat .dl.up { color: var(--good); }
.stat .dl.down { color: var(--danger); }
.mrow { display: grid; grid-template-columns: 96px 1fr 28px; gap: 10px; align-items: center; font-size: .85rem; font-weight: 600; }
.mname { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mtrack { position: relative; height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.mtrack .band { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 18%, transparent); }
.mfill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--muted); }
.mfill.low { background: var(--accent); } .mfill.ok { background: var(--good); } .mfill.high { background: var(--gold); }
.mval { text-align: right; } .mval.ok { color: var(--good); } .mval.low { color: var(--accent); } .mval.high { color: var(--gold); } .mval.zero { color: var(--muted); }
.pr-row { border: 0; background: var(--surface-2); border-radius: 14px; padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; text-align: left; }
.pr-row b { font-weight: 700; display: block; font-size: .9rem; }
.pr-row small { color: var(--muted); font-size: .75rem; }
.pr-ico { width: 32px; height: 32px; border-radius: 10px; background: var(--gold-soft); color: var(--gold); display: grid; place-items: center; }
.pr-ico svg { width: 18px; height: 18px; }
.tag.warn { background: var(--accent-soft); color: var(--accent); margin-top: 3px; }
.inline-form { display: flex; gap: 8px; }
.inline-form .search { flex: 1; }
.inline-form .btn { flex: none; padding: 11px 16px; }
.key { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; }
.key.k1 { background: var(--accent); opacity: .6; } .key.k2 { background: var(--good); }
.next { border: 1.5px solid var(--accent); gap: 6px; }
.next-t { font-size: 1.35rem; }
.seg.seg3 { grid-template-columns: repeat(3, 1fr); }
.cal-wrap { touch-action: pan-y; }
.cal.slide-l { animation: slideL .22s ease; } .cal.slide-r { animation: slideR .22s ease; }
@keyframes slideL { from { transform: translateX(28px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slideR { from { transform: translateX(-28px); opacity: 0; } to { transform: none; opacity: 1; } }
.swipe-hint { font-size: .72rem; color: var(--muted); text-align: center; }

/* Login */
.auth { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding: calc(env(safe-area-inset-top) + 40px) 22px calc(env(safe-area-inset-bottom) + 24px); }
.auth[hidden] { display: none; }
.auth-in { max-width: 420px; margin: 0 auto; display: grid; gap: 14px; }
.auth h1 { font-size: 2rem; margin: 6px 0 0; line-height: 1.05; }
.brand-mark.big { width: 56px; height: 56px; border-radius: 16px; }
.brand-mark.big svg { width: 32px; height: 32px; }
.muted-link { color: var(--muted); font-weight: 600; }
body.locked { overflow: hidden; }

/* Settings */
.row-set { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; font-weight: 600; font-size: .94rem; }
.row-set small { display: block; color: var(--muted); font-weight: 500; font-size: .78rem; }
.switch { appearance: none; -webkit-appearance: none; width: 48px; height: 30px; border-radius: 99px; background: var(--line); position: relative; flex: none; cursor: pointer; margin: 0; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .18s; }
.switch:checked { background: var(--good); }
.switch:checked::after { transform: translateX(18px); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.seg button { border: 1.5px solid var(--line); background: transparent; border-radius: 12px; padding: 10px 0; font-weight: 700; font-size: .88rem; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
input[type="range"] { width: 100%; accent-color: var(--accent); height: 30px; }
.meter-row { display: grid; gap: 5px; font-size: .85rem; }
.meter-row div:first-child { display: flex; justify-content: space-between; gap: 8px; }
.meter { height: 7px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--good); }
.meter span.warn { background: var(--danger); }
.hint { font-size: .8rem; color: var(--muted); margin: 0; line-height: 1.45; }
.field { display: grid; gap: 5px; }
.field label { font-size: .78rem; color: var(--muted); font-weight: 600; }
.field input, .field select, .field textarea { width: 100%; border: 1.5px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 12px; font-size: 16px; }
.field textarea { min-height: 70px; resize: vertical; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border-radius: 14px; padding: 13px 16px; border: 1.5px solid var(--line); background: var(--surface-2); font-weight: 700; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); flex: 1; }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }

/* Rest timer */
.rest { position: fixed; z-index: 7; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom) + var(--nav-h) + 12px); width: min(608px, calc(100% - 32px)); pointer-events: none; display: flex; justify-content: flex-end; }
.rest > * { pointer-events: auto; }
.rest-idle { border: 0; background: var(--ink); color: var(--bg); border-radius: 99px; padding: 10px 16px 10px 12px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: .9rem; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.rest-idle svg { width: 18px; height: 18px; }
.rest-run { width: 100%; background: var(--ink); color: var(--bg); border-radius: 20px; padding: 12px 14px; display: grid; gap: 10px; box-shadow: 0 12px 34px rgba(0,0,0,.3); }
.rest-run.fin { background: var(--good); color: #fff; }
.rest-top { display: flex; align-items: center; gap: 10px; }
.rest-time { font-size: 2.6rem; line-height: .9; min-width: 4ch; }
.rest-lbl { flex: 1; font-size: .78rem; opacity: .75; font-weight: 600; }
.rest-btn { border: 1.5px solid currentColor; background: transparent; color: inherit; border-radius: 12px; padding: 8px 10px; font-weight: 700; font-size: .85rem; }
.rest-bar { height: 5px; border-radius: 99px; background: color-mix(in srgb, currentColor 20%, transparent); overflow: hidden; }
.rest-bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.rest-run.fin .rest-bar span { background: #fff; }

/* Tab bar */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.tabbar-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--nav-h); }
.tabbar button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 4px; color: var(--muted); font-size: .7rem; font-weight: 700; }
.tabbar svg { width: 23px; height: 23px; }
.tabbar button[aria-current="page"] { color: var(--accent); }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(5,6,8,.5); z-index: 10; opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px 18px calc(env(safe-area-inset-bottom) + 18px); max-height: 90%; overflow-y: auto; transform: translateY(105%); transition: transform .26s cubic-bezier(.2,.8,.2,1); max-width: 640px; margin: 0 auto; }
.sheet.open { transform: none; }
.grip { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet h2 { margin: 0 0 14px; font-size: 1.35rem; text-wrap: balance; }
.form { display: grid; gap: 12px; }
.row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.menu { display: grid; gap: 6px; }
.menu button { border: 0; background: var(--surface-2); border-radius: 14px; padding: 14px; text-align: left; font-weight: 700; display: flex; align-items: center; gap: 12px; }
.menu button svg { width: 20px; height: 20px; color: var(--accent); flex: none; }
.menu button.danger, .menu button.danger svg { color: var(--danger); }
.quick { display: flex; flex-wrap: wrap; gap: 6px; }
.quick button { border: 1.5px solid var(--line); background: transparent; border-radius: 99px; padding: 7px 11px; font-size: .84rem; font-weight: 600; }

.toast { position: fixed; z-index: 12; left: 50%; top: calc(env(safe-area-inset-top) + 58px); transform: translate(-50%, -20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 700; font-size: .88rem; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.gold { background: var(--gold); color: #1a1200; }

@keyframes pop { 0% { transform: scale(.9); } 60% { transform: scale(1.06); } 100% { transform: scale(1); } }

@media (max-width: 380px) { .hero-row { grid-template-columns: 1fr; justify-items: center; } .kpis { width: 100%; } .day .c { display: none; } }

<div class="scrim" id="scrim"></div>

      <button type="button" class="link muted-link" id="auth-local" style="justify-self:center">Usar sin cuenta (solo en este equipo)</button>
    </form>
  </div>
</section>

    document.getElementById("swap-hint").textContent = "En vez de \"" + e.name + "\". Solo cambia la sesión de hoy: la rutina queda igual y el peso se guarda en el progreso del ejercicio que hiciste.";
    var dl = document.getElementById("all-ex"); dl.innerHTML = "";
    allExerciseNames().forEach(function (n) { dl.appendChild(el("option", { value: n })); });
    var quick = document.getElementById("swap-quick"); quick.innerHTML = "";
    var same = [];
    state.days.forEach(function (d) { d.ex.forEach(function (x) { if (x.group === e.group && keyOf(x.name) !== keyOf(e.name) && same.indexOf(x.name) < 0) same.push(x.name); }); });
    same.slice(0, 6).forEach(function (n) { quick.appendChild(el("button", { type: "button", text: n, onclick: function () { sName.value = n; } })); });
    sName.value = e.log && e.log.sub ? e.log.sub : "";
    showSheet("sheet-swap");
  }
  document.getElementById("swap-form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var n = sName.value.trim(); if (!n || !swapping) return;
    var e = swapping, log = logFor(e);
    log.sets.forEach(function (s) { s.done = false; }); recordHistory(e);
    log.sub = keyOf(n) === keyOf(e.name) ? null : n;
    log.sets = freshSets(e, performed(e), log.sets.length);
    openState[e.id] = true;
    closeSheet(); persist(); rerenderKeepScroll();
  });

  // ---------- rest timer & alarm ----------
  var restEl = document.getElementById("rest");
  var endAt = 0, startedFor = 0, tick = null, finished = false, finTimer = null, audioCtx = null, warned = false;
  function mmss(sec) { sec = Math.max(0, Math.ceil(sec)); return Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0"); }
  function renderRest() {
    restEl.innerHTML = "";
    if (!endAt && !finished) {
      restEl.appendChild(el("button", { class: "rest-idle", type: "button", html: ICON.timer + '<span class="num"></span>', "aria-label": "Iniciar descanso", onclick: function () { unlockAudio(); startTimer(state.rest); } }));
      restEl.querySelector("span").textContent = "Descanso " + mmss(state.rest);
      return;
    }
    var left = finished ? 0 : (endAt - Date.now()) / 1000;
    var pct = finished ? 1 : Math.max(0, 1 - left / startedFor);
    var box = el("div", { class: "rest-run" + (finished ? " fin" : "") }, [
      el("div", { class: "rest-top" }, finished ? [
        el("div", { class: "rest-time wide", text: "¡Vamos!" }),
        el("div", { class: "rest-lbl", text: "A la siguiente serie" }),
        el("button", { class: "rest-btn", type: "button", text: "OK", onclick: function () { finished = false; clearTimeout(finTimer); renderRest(); } })
      ] : [
        el("div", { class: "rest-time wide num", id: "rest-time", text: mmss(left) }),
        el("div", { class: "rest-lbl", text: "Descanso" }),
        el("button", { class: "rest-btn", type: "button", text: "−15", "aria-label": "Restar 15 segundos", onclick: function () { endAt -= 15000; startedFor = Math.max(1, startedFor - 15); update(); } }),
        el("button", { class: "rest-btn", type: "button", text: "+15", "aria-label": "Sumar 15 segundos", onclick: function () { endAt += 15000; startedFor += 15; update(); } }),
        el("button", { class: "rest-btn", type: "button", text: "Saltar", onclick: function () { stopTimer(false); } })
      ]),
      el("div", { class: "rest-bar" }, [el("span", { id: "rest-bar", style: "width:" + (pct * 100) + "%" })])
    ]);
    restEl.appendChild(box);
  }
  function startTimer(sec) {
    clearTimeout(finTimer); finished = false;
    endAt = Date.now() + sec * 1000; startedFor = sec; warned = sec <= 10;
    clearInterval(tick); tick = setInterval(update, 250);
    renderRest();
  }
  function stopTimer(done) {
    clearInterval(tick); endAt = 0;
    if (done) { finished = true; beep(); finTimer = setTimeout(function () { finished = false; renderRest(); }, 6000); }
    renderRest();
  }
  function update() {
    if (!endAt) return;
    var left = (endAt - Date.now()) / 1000;
    if (left <= 0) { stopTimer(true); return; }
    if (!warned && left <= 10) { warned = true; if (state.alert.warn10 && state.alert.sound) playTone(null, true); }
    var t = document.getElementById("rest-time"), b = document.getElementById("rest-bar");
    if (t) t.textContent = mmss(left);
    if (b) b.style.width = Math.max(0, 1 - left / startedFor) * 100 + "%";
  }
  document.addEventListener("visibilitychange", function () { if (!document.hidden) update(); });
  function unlockAudio() { try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); } catch (e) {} }
  function note(freq, start, dur, peak, type) {
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "sine"; o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
    var t = audioCtx.currentTime + start;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function playTone(tone, short) {
    var v = Math.max(0.0002, state.alert.volume);
    try {
      if (!audioCtx) return;
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (short) { note(1046, 0, 0.15, v * 0.6); return; }
      if (tone === "bell") [0, 0.6].forEach(function (d) { note(784, d, 1.2, v * 0.7); note(1568, d, 0.8, v * 0.25); note(2352, d, 0.4, v * 0.1); });
      else if (tone === "alarm") for (var i = 0; i < 6; i++) note(i % 2 ? 1175 : 880, i * 0.18, 0.16, v, "square");
      else [0, 0.25, 0.5].forEach(function (d) { note(880, d, 0.18, v * 0.8); });
    } catch (e) {}
  }
  function beep() {
    var a = state.alert;
    if (a.sound) playTone(a.tone);
    if (a.vibrate) try { if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 400]); } catch (e) {}
  }

  // ---------- start ----------
  setView("train");
  renderRest();

  // ---------- cloud sync (Supabase, optional) ----------
  // Table user_data(user_id, key, data): key "rutina" holds the routine, "hist:YYYY-MM" each month of history.
  var CFG = window.RUTINA_CONFIG || {};
  var supa = null, session = null;
  var authEl = document.getElementById("auth");
  function showAuth(on) { authEl.hidden = !on; document.body.classList.toggle("locked", on); }
  function applyRows(rows) {
    if (dirty) return;
    var main = null, h = {}, km = {};
    rows.forEach(function (r) {
      if (r.key === "rutina") main = r.data;
      else if (r.key.indexOf("hist:") === 0) {
        var m = r.key.slice(5); km[m] = 1;
        var b = r.data || {};
        Object.keys(b.ex || {}).forEach(function (k) { (h[k] || (h[k] = [])).push.apply(h[k], b.ex[k]); });
      }
    });
    knownMonths = km;
    if (!main) { markAllMonths(); persist(); return; } // first time: upload what this phone has
    var copy = JSON.parse(JSON.stringify(main));
    state.days = copy.days; state.rest = copy.rest || 90; if (copy.alert) state.alert = copy.alert;
    state.skipped = copy.skipped || {}; if (copy.started && (!state.started || copy.started < state.started)) state.started = copy.started; state.body = Array.isArray(copy.body) ? copy.body : (state.body || []);
    if (copy.todayPick && copy.todayPick.date === TODAY) { state.todayPick = copy.todayPick; if (copy.days[copy.todayPick.idx]) current = copy.todayPick.idx; }
    Object.keys(h).forEach(function (k) { h[k].sort(function (a, b) { return a.date < b.date ? -1 : 1; }); });
    if (Object.keys(km).length || !Object.keys(state.history).length) state.history = h;
    else { markAllMonths(); persist(); }
    state = normalize(state);
    cacheLocal();
    var a = document.activeElement;
    var typing = a && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && viewEl.contains(a);
    if (!openSheetEl && !typing) { rerenderKeepScroll(); if (!endAt && !finished) renderRest(); }
  }
  function pull() {
    if (!supa || !session) return Promise.resolve();
    return supa.from("user_data").select("key,data").then(function (res) {
      if (res.error) { setStatus("warn", "Sin conexión"); return; }
      cloudOk = true; applyRows(res.data || []); if (!dirty) setStatus("ok", "Sincronizado");
    }, function () { setStatus("warn", "Sin conexión"); });
  }
  function wrap(p) { return p.then(function (res) { if (res && res.error) throw { code: "unavailable", message: res.error.message }; return res; }); }
  function connect() {
    var uidv = session.user.id;
    ref = { set: function (body) { return wrap(supa.from("user_data").upsert({ user_id: uidv, key: "rutina", data: body, updated_at: new Date().toISOString() })); } };
    histCol = { doc: function (m) { return {
      set: function (body) { return wrap(supa.from("user_data").upsert({ user_id: uidv, key: "hist:" + m, data: body, updated_at: new Date().toISOString() })); },
      "delete": function () { return wrap(supa.from("user_data").delete().eq("user_id", uidv).eq("key", "hist:" + m)); }
    }; } };
    showAuth(false);
    setStatus("saving", "Sincronizando…");
    pull();
  }
  window.rutinaAccount = function () { return session ? session.user.email : null; };
  window.rutinaSignOut = function () { if (supa) supa.auth.signOut().then(function () { session = null; ref = null; histCol = null; cloudOk = false; setStatus("warn", "Sin cuenta"); showAuth(true); }); };

  // login form
  var aForm = document.getElementById("auth-form"), aMsg = document.getElementById("auth-msg"), aMode = "in";
  function setMode(m) {
    aMode = m;
    document.getElementById("auth-title").textContent = m === "in" ? "Entra a tu cuenta" : "Crea tu cuenta";
    document.getElementById("auth-go").textContent = m === "in" ? "Entrar" : "Crear cuenta";
    document.getElementById("auth-switch").textContent = m === "in" ? "¿Primera vez? Crea tu cuenta" : "Ya tengo cuenta";
    document.getElementById("a-pass").autocomplete = m === "in" ? "current-password" : "new-password";
    aMsg.textContent = "";
  }
  document.getElementById("auth-switch").addEventListener("click", function () { setMode(aMode === "in" ? "up" : "in"); });
  document.getElementById("auth-local").addEventListener("click", function () { showAuth(false); setStatus("warn", "Solo este equipo"); });
  aForm.addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!supa) return;
    var email = document.getElementById("a-email").value.trim(), pass = document.getElementById("a-pass").value;
    if (pass.length < 6) { aMsg.textContent = "La contraseña necesita al menos 6 caracteres."; return; }
    aMsg.textContent = aMode === "in" ? "Entrando…" : "Creando tu cuenta…";
    var p = aMode === "in" ? supa.auth.signInWithPassword({ email: email, password: pass }) : supa.auth.signUp({ email: email, password: pass });
    p.then(function (res) {
      if (res.error) {
        var m = res.error.message || "";
        aMsg.textContent = /invalid login/i.test(m) ? "Email o contraseña incorrectos." : /already registered/i.test(m) ? "Ese email ya tiene cuenta: toca «Ya tengo cuenta»." : "No se pudo: " + m;
        return;
      }
      if (res.data && res.data.session) { session = res.data.session; connect(); toast(aMode === "in" ? "¡Hola de nuevo!" : "Cuenta creada"); }
      else aMsg.textContent = "Revisa tu email para confirmar la cuenta y después entra.";
    }, function () { aMsg.textContent = "Sin conexión. Prueba de nuevo cuando tengas internet."; });
  });

  if (!CFG.supabaseUrl || !CFG.supabaseKey || !window.supabase) {
    setStatus("warn", CFG.supabaseUrl ? "Sin conexión" : "Solo este equipo");
  } else {
    supa = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, autoRefreshToken: true } });
    supa.auth.getSession().then(function (r) {
      session = r.data && r.data.session;
      if (session) connect(); else { setStatus("warn", "Sin cuenta"); showAuth(true); }
    }, function () { setStatus("warn", "Sin conexión"); });
    document.addEventListener("visibilitychange", function () { if (!document.hidden && session && !dirty) pull(); });
    window.addEventListener("online", function () { if (session) { markAllMonths(); persist(); } });
  }
})();

</script>
</body>
</html>
