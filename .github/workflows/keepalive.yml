# Keeps the free Supabase project from pausing (it pauses after 7 days without activity)
# and keeps this scheduled workflow from being auto-disabled by GitHub after 60 days.
name: Mantener base de datos activa
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS -X POST "https://ztbyusajfiwwynpukcew.supabase.co/rest/v1/rpc/keepalive" \
            -H "apikey: sb_publishable_19DDwzqhihUWXoCFg_YgvQ_XiidJfFH" \
            -H "Content-Type: application/json" -d '{}'
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
